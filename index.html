<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1217">
<title>Stock P&L Calendar</title>












<link rel="manifest" href="./manifest.json?v=29">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/stock-pnl-v17-192.png?v=17">
<link rel="apple-touch-icon" href="./icons/stock-pnl-v17-192.png?v=17">
<meta name="application-name" content="Stock P&L Calendar">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style id="FINAL-CLEAN-V7">
:root{
 --bg:#06131c; --panel:#071821; --panel2:#0b1d27; --line:#2a3f49;
 --text:#f3f6f7; --muted:#aeb8be; --mint1:#6fdfba; --mint2:#91e9c8;
 --green:#3fd67e; --red:#ff5550;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input{font:inherit}
.app{width:100%;max-width:430px;margin:0 auto;padding:8px 10px 12px}
.top{background:linear-gradient(150deg,#081a24,#06151e);border:1px solid var(--line);border-radius:18px;padding:13px 13px 14px}
.top h1,.top>.muted{display:none}
.compat-hidden{display:none!important}
.stats.single-stat{display:block;margin:0 0 12px}
.stat.net-only{background:transparent;border:0;padding:0;min-height:54px}
.stat.net-only small{display:block;color:#b3bdc2;font-size:14px;line-height:1.1;margin:0 0 5px;font-weight:450}
.stat.net-only b{display:block;color:#fff;font-size:27px;line-height:1;font-weight:760;letter-spacing:.15px}
.market-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 13px}
.market-tab{height:45px;border:1.5px solid #30444e;border-radius:12px;background:#06131c;color:#dce1e4;font-size:16px;font-weight:400;padding:0 4px;white-space:nowrap}
.market-tab.active{background:linear-gradient(135deg,var(--mint1),var(--mint2));border-color:#84e6c5;color:#071913}
.fno-tabs{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.fno-tab{height:39px;border:1.5px solid #30444e;border-radius:11px;background:#06131c;color:#c9d1d5;font-size:15px;font-weight:650}
.fno-tab.active{background:linear-gradient(135deg,var(--mint1),var(--mint2));border-color:#84e6c5;color:#071913}
.actions{display:grid;grid-template-columns:1fr 1.18fr;gap:9px 9px;margin:0;align-items:stretch}
.actions button{height:43px;border-radius:12px;border:1.5px solid #30444e;padding:0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:flex-start;gap:7px;white-space:nowrap}
.actions .accent{background:linear-gradient(135deg,var(--mint1),var(--mint2));border-color:#84e6c5;color:#071913}
.actions .darkbtn{background:#07151e;color:#f2f4f5}
.actions .import-btn{grid-column:1/2}
.btn-icon{font-size:20px;font-weight:350;line-height:1}
.nav{display:grid;grid-template-columns:47px 1fr 47px;gap:6px;align-items:center;margin:10px 0;min-height:51px}
.nav-arrow{width:47px;height:47px;border-radius:12px!important;border:1.5px solid #30444e!important;background:#0a1923!important;color:#fff!important;padding:0!important;font-size:31px!important;font-weight:300!important;line-height:1!important;display:flex;align-items:center;justify-content:center}
.month-wrap{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0}
.month{font-size:20px;font-weight:400;line-height:1.05;letter-spacing:-.2px;white-space:nowrap}
.month-divider{width:1px;height:38px;background:#87939a;opacity:.8;flex:none}
.pl-box{min-width:91px;text-align:left}
.pl-title{font-size:13px;line-height:1.05;color:#e0e5e7;margin:0 0 4px;white-space:nowrap;font-weight:450}
.pl-count{font-size:21px;line-height:1;font-weight:680}
#profitCount{color:var(--green)} #lossCount{color:var(--red)} .pl-slash{color:#e6eaec;margin:0 5px}
.cal{background:linear-gradient(150deg,#071822,#06151e);border:1.5px solid #30444e;border-radius:18px;padding:9px 8px 7px;overflow:hidden}
.head,.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(52px,.82fr);gap:4px}
.head div{color:#aeb8be;font-size:13px;font-weight:700;text-align:center;padding:2px 0 7px;line-height:1}
.week{margin-bottom:4px;align-items:stretch}
.week:last-child{margin-bottom:0}
.day,.gain{height:56px;min-height:56px;border-radius:8px;border:1px solid rgba(101,132,145,.24);background:linear-gradient(145deg,#132630,#0f2029)}
.day{padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;color:#f4f6f7;overflow:hidden;text-align:center}
.day.empty{opacity:.62}
.day.profit{background:linear-gradient(145deg,#132630,#0f2029)}
.day.loss{background:linear-gradient(145deg,#29191f,#22161b);border-color:#7d2b35}
.num{font-size:16px;line-height:1;font-weight:750;white-space:nowrap}
.pnl{font-size:11px;line-height:1;font-weight:700;margin-top:2px;white-space:nowrap;letter-spacing:-.1px}
.day.profit .pnl{color:var(--green)} .day.loss .pnl{color:#ff625e}
.count{display:block;font-size:9.5px;line-height:1;font-weight:500;color:#ffd928;white-space:nowrap;margin-top:0;text-align:center}.count:empty{display:none}
.gain{display:flex;align-items:center;justify-content:center;padding:0 2px;font-size:11px;line-height:1;font-weight:680;color:#d2d8db;white-space:nowrap;text-align:center}
.gain.profit{color:var(--green)} .gain.loss{color:#ff625e}
.cal::after{content:"ⓘ  Tap a date to see closed picks for that day.";display:block;text-align:center;color:#aeb7bc;font-size:10.8px;line-height:1.2;margin-top:5px;padding:2px 0 1px}
/* modal */
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}
.sheet{background:#f8fbfc;color:#1c282e;width:min(430px,100%);max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px}
.sheettop{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:#f8fbfc;padding:8px 0 10px;z-index:2}
.sheettop b{font-size:20px;line-height:1.15}
.close{width:38px;height:38px;border:0;border-radius:50%;background:#e6ecef;font-size:24px;padding:0}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.box{background:white;border:1px solid #dce6ea;border-radius:12px;padding:10px 6px;text-align:center}
.box small{display:block;color:#74858d;font-size:11px;margin-bottom:4px}
.box b{font-size:16px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:white;border:1px solid #dce6ea;padding:10px;border-radius:14px;margin:10px 0}
.field{min-width:0}
.field label{display:block;color:#46575f;font-size:11px;font-weight:650;margin:0 0 5px 2px;white-space:nowrap}
.field.stock-field,.field.charges-field,.form button{grid-column:1/-1}
input{width:100%;border:1px solid #ccd9df;border-radius:10px;padding:10px 8px;background:#fff;color:#1c282e}
.stock-field input{font-size:16px;padding:11px 9px}
.form button{border:0;border-radius:10px;padding:10px;background:#8fe1c2;color:#0c4034;font-weight:800;font-size:16px}
.row{background:white;border:1px solid #dce6ea;border-radius:13px;padding:10px;margin:8px 0}
.rowtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.trade-main{min-width:0;flex:1}
.trade-main>b{display:block;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.trade-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.net{font-weight:900;font-size:15px;white-space:nowrap}
.profitT{color:#127058}.lossT{color:#c84737}
.small{font-size:11px;color:#6b7c84;margin-top:5px;line-height:1.3}
.trade-actions{display:flex;gap:6px}
.edit,.del{border-radius:8px;padding:6px 9px;font-size:12px;background:#fff}
.edit{color:#174caa;border:1px solid #7da5ff}
.del{color:#c32121;border:1px solid #ff8a8a;background:#fff5f4}
@media(max-width:360px){
 .field label{font-size:10px}
 .form{gap:6px;padding:9px}
 input{padding:9px 6px;font-size:13px}
 .trade-main>b{font-size:14px}
 .net{font-size:14px}
 .edit,.del{padding:5px 7px;font-size:11px}
}
@media(max-width:360px){
 .app{padding:6px 8px 10px}.top{padding:11px 11px 12px}.stat.net-only b{font-size:25px}.market-tab{font-size:15px;height:43px}.actions button{font-size:13px;padding:0 8px}.month{font-size:19px}.pl-box{min-width:86px}.pl-title{font-size:12px}.pl-count{font-size:20px}.day,.gain{height:53px;min-height:53px}.num{font-size:15px}.pnl{font-size:11px}.gain{font-size:11px}
}

/* Requested typography + Netlify helper cleanup */
.market-tab, .market-tab.active, .month{font-weight:400!important;}
/* Common Netlify Drawer / helper hosts */
iframe[src*="netlify" i], iframe[title*="netlify" i], [class*="netlify" i], [id*="netlify" i], [data-netlify], netlify-toolbar, netlify-drawer, [data-testid*="netlify" i]{visibility:hidden!important;}

/* V12: fit complete monthly chart in one mobile viewport */
@media (max-height: 760px){
  .app{padding-top:5px;padding-bottom:6px}
  .top{padding:10px 12px 11px;border-radius:16px}
  .stats.single-stat{margin-bottom:9px}
  .stat.net-only{min-height:49px}
  .stat.net-only small{font-size:13px;margin-bottom:4px}
  .stat.net-only b{font-size:25px}
  .market-tabs{margin-bottom:10px;gap:7px}
  .market-tab{height:40px;font-size:15px}
  .actions{gap:7px 8px}
  .actions button{height:38px;font-size:13px}
  .nav{margin:7px 0;min-height:45px;grid-template-columns:43px 1fr 43px}
  .nav-arrow{width:43px;height:43px;font-size:28px!important}
  .month{font-size:18px}
  .month-divider{height:34px}
  .pl-title{font-size:12px}
  .pl-count{font-size:19px}
  .cal{padding:7px 7px 5px;border-radius:16px}
  .head div{font-size:12px;padding-bottom:5px}
  .head,.week{gap:3px}
  .week{margin-bottom:3px}
  .day,.gain{height:47px;min-height:47px}
  .day{padding:5px 4px 4px;gap:2px}
  .num{font-size:15px}
  .pnl{font-size:10.5px;margin-top:1px}
  .gain{font-size:11px}
  .cal::after{font-size:9.8px;margin-top:3px;padding:1px 0 0}
}
@media (max-height: 680px){
  .top{padding:8px 10px 9px}
  .stat.net-only b{font-size:23px}
  .market-tab{height:36px}
  .actions button{height:35px}
  .nav{margin:5px 0}
  .day,.gain{height:43px;min-height:43px}
  .num{font-size:14px}
  .pnl{font-size:10px}
  .cal::after{font-size:9px}
}


/* V26 FINAL REFERENCE FIX */
.day{align-items:center!important;text-align:center!important}
.num{width:100%;text-align:center!important}
.pnl{font-size:11px!important;font-weight:700!important;line-height:1!important}
.count{color:#ffd928!important;font-size:8px!important;font-weight:400!important;line-height:1!important;letter-spacing:-.35px!important;white-space:nowrap!important;transform:scaleX(.84);transform-origin:center center;width:118%;margin-left:-9%;text-align:center!important}
.gain{font-size:10.5px!important;font-weight:620!important}
.bottom-nav{margin-top:8px;border:1.5px solid #30444e;border-radius:17px;background:linear-gradient(150deg,#071822,#06151e);display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 4px 7px}
.bottom-nav button{border:0;background:transparent;color:#aeb8be;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;padding:2px 0;font-size:11px;font-weight:400}
.bottom-nav button.active{color:var(--green)}
.bottom-nav .bn-icon{font-size:21px;line-height:1;font-weight:400}
.fy-view,.history-view{display:none;margin-top:8px;background:linear-gradient(150deg,#071822,#06151e);border:1.5px solid #30444e;border-radius:18px;padding:12px}
.view-title{font-size:20px;font-weight:700;margin-bottom:10px}
.fy-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-end;border:1px solid #2c414c;border-radius:13px;padding:10px;margin-bottom:10px}
.fy-range{font-size:17px;font-weight:700}.fy-sub{font-size:11px;color:#aeb8be;margin-top:3px}.fy-total{text-align:right;color:var(--green);font-size:17px;font-weight:700}
.fy-row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #223944;padding:9px 3px;font-size:13px}.fy-row:first-child{border-top:0}.fy-pos{color:var(--green);font-weight:650}.fy-neg{color:#ff625e;font-weight:650}.fy-zero{color:#d0d6d9}
.history-item{border-top:1px solid #223944;padding:8px 2px;font-size:12px}.history-item:first-child{border-top:0}.history-item b{display:block;font-size:13px}.history-meta{color:#aeb8be;margin-top:2px}
@media(max-width:360px){.count{font-size:7.4px!important;letter-spacing:-.45px!important;transform:scaleX(.80);width:124%;margin-left:-12%}.bottom-nav button{font-size:10px}.bottom-nav .bn-icon{font-size:19px}}


/* V28 company/commodity search + improved logo resolution + transaction */
.asset-picker{grid-column:1/-1;position:relative}
.asset-picker-title{display:block;color:#46575f;font-size:11px;font-weight:650;margin:0 0 6px 2px}
.asset-toggle{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:8px;border:1px solid #cbd8de;border-radius:10px;overflow:hidden;max-width:310px}
.asset-toggle button{grid-column:auto!important;border:0!important;border-radius:0!important;padding:9px 7px!important;background:#fff!important;color:#1d2b31!important;font-weight:650!important;font-size:13px!important}
.asset-toggle button.active{background:linear-gradient(135deg,var(--mint1),var(--mint2))!important;color:#082218!important}
.asset-search-wrap{position:relative}.asset-search-wrap:before{content:'⌕';position:absolute;left:10px;top:8px;color:#566b75;font-size:20px;z-index:1}.asset-search-wrap input{padding-left:35px}
.asset-results{display:none;position:relative;margin-top:5px;border:1px solid #d6e1e6;border-radius:11px;background:#fff;max-height:235px;overflow:auto;box-shadow:0 6px 18px #0002;z-index:4}.asset-results.show{display:block}
.asset-option{display:flex;align-items:center;gap:9px;padding:8px 9px;border-bottom:1px solid #edf2f4;cursor:pointer;text-align:left}.asset-option:last-child{border-bottom:0}.asset-option:active{background:#eef8f4}.asset-name{font-size:13px;font-weight:700;line-height:1.15}.asset-symbol{font-size:10px;color:#75858d;margin-top:2px}
.asset-logo{width:34px;height:34px;flex:0 0 34px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid #e2e8eb;padding:2px}.asset-logo.fallback{display:flex;align-items:center;justify-content:center;background:#eaf3f6;color:#173947;font-size:12px;font-weight:800;padding:0}
.asset-add{display:flex;align-items:center;gap:6px;padding:8px 10px;color:#087944;font-weight:750;font-size:12px;cursor:pointer}.asset-selected{display:none;align-items:center;gap:8px;margin-top:7px;padding:7px 9px;border-radius:10px;background:#eef8f4;border:1px solid #c7eadb}.asset-selected.show{display:flex}.asset-selected .asset-logo{width:30px;height:30px;flex-basis:30px}.asset-clear{margin-left:auto;border:0!important;background:transparent!important;color:#5a6a71!important;padding:2px 5px!important;grid-column:auto!important}
.trade-with-logo{display:flex;align-items:flex-start;gap:9px}.trade-with-logo .trade-main{flex:1}.trade-card-logo{width:42px;height:42px;flex:0 0 42px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid #dce6ea;padding:3px}.trade-card-logo.fallback{display:flex;align-items:center;justify-content:center;background:#eaf3f6;color:#173947;font-size:13px;font-weight:800;padding:0}
.history-view,.transaction-view{display:none;margin-top:8px;background:linear-gradient(150deg,#071822,#06151e);border:1.5px solid #30444e;border-radius:18px;padding:12px}
.history-item,.tx-item{border-top:1px solid #223944;padding:9px 2px;display:flex;align-items:center;gap:10px}.history-item:first-of-type,.tx-item:first-of-type{border-top:0}.history-logo{width:42px;height:42px;flex:0 0 42px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid #29414c;padding:3px}.history-logo.fallback{display:flex;align-items:center;justify-content:center;background:#102630;color:#dceef4;font-size:12px;font-weight:800;padding:0}.history-copy{min-width:0;flex:1}.history-copy b{display:block;font-size:13px;line-height:1.2}.history-meta{color:#aeb8be;margin-top:3px;font-size:11px}.history-chevron{font-size:25px;color:#d4dcdf;font-weight:300}
.tx-status{font-size:11px;font-weight:750}.tx-open{color:#ffd928}.tx-profit{color:var(--green)}.tx-loss{color:#ff625e}
.mini-dialog{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:80;padding:18px}.mini-dialog.show{display:flex}.mini-box{width:min(360px,100%);background:#fff;color:#1c282e;border-radius:16px;padding:14px}.mini-box h3{margin:0 0 10px;font-size:18px}.mini-box input{margin:5px 0 8px}.mini-actions{display:flex;gap:8px;justify-content:flex-end}.mini-actions button{border-radius:9px;padding:8px 12px;font-weight:700;border:1px solid #cbd8de;background:#fff}.mini-actions .save-mini{background:#8fe1c2;border-color:#8fe1c2;color:#0c4034}
@media(max-width:360px){.asset-toggle{max-width:none}.asset-name{font-size:12px}.asset-results{max-height:210px}.trade-card-logo,.history-logo{width:38px;height:38px;flex-basis:38px}}

</style>
</head>
<body>
<div class="app">
 <div class="top">
  <h1>Stock P&L Calendar</h1>
  <div class="muted">Tap any date to add stock P&L and charges. Data stays on your phone.</div>
  <div class="stats single-stat">
    <div class="stat net-only"><small id="netLabel">Monthly Net P&amp;L</small><b id="netStat"></b></div>
    <span id="grossLabel" class="compat-hidden"></span><span id="chargeLabel" class="compat-hidden"></span>
    <span id="grossStat" class="compat-hidden"></span><span id="chargeStat" class="compat-hidden"></span>
   </div>
  <div class="market-tabs">
<button class="market-tab active" data-market="stock">Stock</button>
<button class="market-tab" data-market="fno">F&O</button>
<button class="market-tab" data-market="commodity">Commodity</button>
</div><div class="fno-tabs" id="fnoTabs" style="display:none">
<button class="fno-tab active" data-fno="future">Future</button>
<button class="fno-tab" data-fno="option">Option</button>
</div>
  <div class="actions">
   
   <button class="accent add-today" onclick="quickToday()"><span class="btn-icon">＋</span><span>Add Today</span></button>
   <button class="darkbtn export-btn" onclick="exportData()"><span class="btn-icon">⇧</span><span>Export Backup</span></button>
   <button class="darkbtn import-btn" onclick="document.getElementById('importFile').click()"><span class="btn-icon">⇩</span><span>Import Backup</span></button>
   <input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
 </div>
 <div class="nav">
  <button class="nav-arrow" onclick="move(-1)">‹</button>

  <div class="month-wrap">
    <div class="month" id="month"></div>

    <div class="month-divider"></div>

    <div class="pl-box">
      <div class="pl-title">Profit / Loss</div>
      <div class="pl-count">
        <span id="profitCount">0</span>
        <span class="pl-slash">/</span>
        <span id="lossCount">0</span>
      </div>
    </div>
  </div>

  <button class="nav-arrow" onclick="move(1)">›</button>
</div>
 <div class="cal"><div class="head"><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>Gains</div></div><div id="weeks"></div></div>
 <div class="fy-view" id="fyView"></div>
 <div class="history-view" id="historyView"></div>
 <div class="transaction-view" id="transactionView"></div>
 <div class="bottom-nav" id="bottomNav">
   <button id="bnCalendar" class="active" onclick="showCalendarView()"><span class="bn-icon">▣</span><span>Calendar</span></button>
   <button id="bnHistory" onclick="showHistoryView()"><span class="bn-icon">▤</span><span>History</span></button>
   <button id="bnFy" onclick="showFySummary()"><span class="bn-icon">⌁</span><span>FY Summary</span></button>
   <button id="bnTransaction" onclick="showTransactionView()"><span class="bn-icon">⇄</span><span>Transaction</span></button>
 </div>
</div>
<div class="modal" id="modal"><div class="sheet">
 <div class="sheettop"><b id="dateTitle"></b><button class="close" onclick="closeModal()">×</button></div>
 <div class="summary" id="daySummary"></div>
 <div class="form" id="tradeForm">

const ASSET_CUSTOM_COMPANY_KEY='stockPnL_customCompanies_v29', ASSET_CUSTOM_COMMODITY_KEY='stockPnL_customCommodities_v29';
let assetType='company', selectedAsset=null;
function initials(name){return (name||'?').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?'}
function companyLogoUrl(a){return a&&a.domain?`https://logo.clearbit.com/${encodeURIComponent(a.domain)}?size=128`:''}
function companyLogoFallbackUrl(a){return a&&a.domain?`https://www.google.com/s2/favicons?sz=256&domain_url=${encodeURIComponent('https://'+a.domain)}`:''}
function getCustomCompanies(){try{return JSON.parse(localStorage.getItem(ASSET_CUSTOM_COMPANY_KEY)||'[]')}catch{return []}}
function getCustomCommodities(){try{return JSON.parse(localStorage.getItem(ASSET_CUSTOM_COMMODITY_KEY)||'[]')}catch{return []}}
function allCompanies(){const map=new Map();[...COMPANY_MASTER,...getCustomCompanies()].forEach(x=>map.set((x.name||'').toLowerCase(),x));return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function allCommodities(){const map=new Map();[...COMMODITY_MASTER,...getCustomCommodities()].forEach(x=>map.set((x.name||'').toLowerCase(),x));return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name))}
function assetLogoHTML(a,cls='asset-logo'){if(assetType==='commodity'||a?.type==='commodity'){return `<span class="${cls} fallback">${a?.icon||'◆'}</span>`}const url=a?.logo||companyLogoUrl(a),fb=companyLogoFallbackUrl(a);if(url){const safeFb=(fb||'').replace(/'/g,'%27');return `<img class="${cls}" src="${url}" alt="" onerror="if(!this.dataset.fb&&'${safeFb}'){this.dataset.fb='1';this.src='${safeFb}'}else{this.outerHTML='<span class=\'${cls} fallback\'>${initials(a?.name)}</span>'}">`}return `<span class="${cls} fallback">${initials(a?.name)}</span>`}
function findAssetByName(name,type){
  const list=type==='commodity'?allCommodities():allCompanies();
  const q=(name||'').trim().toLowerCase();
  let hit=list.find(x=>(x.name||'').toLowerCase()===q||(x.symbol||'').toLowerCase()===q);
  if(hit||type==='commodity') return hit||null;
  const aliasKey=Object.keys(LEGACY_COMPANY_ALIAS).find(k=>k.toLowerCase()===q);
  if(aliasKey){const sym=LEGACY_COMPANY_ALIAS[aliasKey];hit=list.find(x=>(x.symbol||'').toLowerCase()===String(sym).toLowerCase());}
  return hit||null;
}
function setAssetType(type){assetType=type;selectedAsset=null;stock.value='';assetSelected.classList.remove('show');assetCompanyBtn.classList.toggle('active',type==='company');assetCommodityBtn.classList.toggle('active',type==='commodity');stock.placeholder=type==='company'?'Type to search company...':'Type to search commodity...';searchAssets()}
function searchAssets(){const q=(stock.value||'').trim().toLowerCase();const list=(assetType==='company'?allCompanies():allCommodities()).filter(x=>!q||(x.name||'').toLowerCase().includes(q)||(x.symbol||'').toLowerCase().includes(q)).slice(0,60);assetResults.innerHTML=list.map((a,i)=>`<div class="asset-option" onclick="chooseAsset(${i})">${assetLogoHTML({...a,type:assetType})}<div><div class="asset-name">${a.name}</div></div></div>`).join('')+`<div class="asset-add" onclick="openAssetAdd()">＋ Add New ${assetType==='company'?'Company':'Commodity'}</div>`;assetResults.dataset.items=JSON.stringify(list);assetResults.classList.add('show')}
function chooseAsset(i){let list=[];try{list=JSON.parse(assetResults.dataset.items||'[]')}catch{};const a=list[i];if(!a)return;selectedAsset={...a,type:assetType};stock.value=a.name;assetSelected.innerHTML=`${assetLogoHTML(selectedAsset)}<div><div class="asset-name">${a.name}</div></div><button class="asset-clear" type="button" onclick="clearSelectedAsset()">×</button>`;assetSelected.classList.add('show');assetResults.classList.remove('show')}
function clearSelectedAsset(){selectedAsset=null;stock.value='';assetSelected.classList.remove('show');searchAssets()}
function openAssetAdd(){assetAddTitle.textContent=assetType==='company'?'Add New Company':'Add New Commodity';assetAddName.value=stock.value.trim();assetAddSymbol.value='';assetAddLogo.value='';assetAddDialog.classList.add('show');assetResults.classList.remove('show')}
function closeAssetAdd(){assetAddDialog.classList.remove('show')}

function tradeCalendarDate(t){return (!isOpenTrade(t)&&t.sellDate)?t.sellDate:t.date}
function byDate(ds){return trades.filter(t=>tradeCalendarDate(t)===ds)}
function isOpenTrade(t){return t.sellPrice===undefined||t.sellPrice===null||t.sellPrice===''||t.sellQty===undefined||t.sellQty===null||t.sellQty===''}
function calcGross(t){if(isOpenTrade(t))return 0;return (Number.isFinite(+t.buyPrice)&&Number.isFinite(+t.buyQty)&&Number.isFinite(+t.sellPrice)&&Number.isFinite(+t.sellQty))?((+t.sellPrice*+t.sellQty)-(+t.buyPrice*+t.buyQty)):(+t.gross||0)}
function realisedCharges(t){return isOpenTrade(t)?0:(+t.charges||0)}
function sumDay(ds){return byDate(ds).reduce((a,t)=>a+calcGross(t)-realisedCharges(t),0)}
function updateStats(){
 let y=cursor.getFullYear(),m=cursor.getMonth();
 let monthTrades=trades.filter(t=>{let d=new Date(tradeCalendarDate(t)+'T12:00:00');return d.getFullYear()===y&&d.getMonth()===m});

 grossStat.textContent=money(g);chargeStat.textContent=money(c);netStat.textContent=money(g-c);
 let mn=cursor.toLocaleString('en-IN',{month:'short',year:'numeric'});
 if(document.getElementById('grossLabel')) grossLabel.textContent=mn+' Gross P&L';
 if(document.getElementById('chargeLabel')) chargeLabel.textContent=mn+' Charges';
 if(document.getElementById('netLabel')) netLabel.textContent=mn+' Net P&L';
const monthDays=[...new Set(monthTrades.map(t=>tradeCalendarDate(t)))];
let profits=0,losses=0;

monthDays.forEach(ds=>{
  const n=sumDay(ds);
  if(n>0) profits++;
  else if(n<0) losses++;
});

const pc=document.getElementById('profitCount');
const lc=document.getElementById('lossCount');
if(pc) pc.textContent=profits;
if(lc) lc.textContent=losses;
}

function tradeGross(t){
  if(isOpenTrade(t)) return 0;
  if(Number.isFinite(+t.buyPrice)&&Number.isFinite(+t.buyQty)&&Number.isFinite(+t.sellPrice)&&Number.isFinite(+t.sellQty)){
    return (+t.sellPrice * +t.sellQty) - (+t.buyPrice * +t.buyQty);
  }
  return +t.gross||0;
}
function formatDateShort(ds){if(!ds)return '';const d=new Date(ds+'T12:00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function tradeDetail(t){
  const hasBuy=[t.buyPrice,t.buyQty].every(v=>v!==undefined&&v!==null&&v!=='');
  if(hasBuy && isOpenTrade(t)){
    return `Buy ${money(+t.buyPrice)} × ${+t.buyQty} &nbsp;•&nbsp; <b>OPEN / HOLDING</b><br>Buy date ${formatDateShort(t.buyDate||t.date)} &nbsp;•&nbsp; Charges ${money(+t.charges||0)}`;
  }
  const hasNew=[t.buyPrice,t.buyQty,t.sellPrice,t.sellQty].every(v=>v!==undefined&&v!==null&&v!=='');
  if(hasNew){
    return `Buy ${money(+t.buyPrice)} × ${+t.buyQty} &nbsp;•&nbsp; Sell ${money(+t.sellPrice)} × ${+t.sellQty}<br>${t.buyDate?`Buy date ${formatDateShort(t.buyDate)} &nbsp;•&nbsp; `:''}${t.sellDate?`Sell date ${formatDateShort(t.sellDate)} &nbsp;•&nbsp; `:''}Charges ${money(+t.charges||0)}`;
  }
  return `Gross ${money(+t.gross||0)} &nbsp;•&nbsp; Charges ${money(+t.charges||0)}`;
}

function addTrade(){
  let st=stock.value.trim(),
      bp=parseFloat(buyPrice.value),bq=parseFloat(buyQty.value),
      spText=sellPrice.value.trim(),sqText=sellQty.value.trim(),sd=sellDate.value.trim(),
      sp=spText===''?null:parseFloat(spText),sq=sqText===''?null:parseFloat(sqText),
      c=parseFloat(charges.value||0);
  if(!st||Number.isNaN(bp)||Number.isNaN(bq)){alert('Enter stock name, buying price and buying quantity.');return}
  if(bp<0||bq<=0){alert('Buying price must be 0 or more, and buying quantity must be greater than 0.');return}
  const sellBlank=(spText===''&&sqText==='');
  const sellComplete=(spText!==''&&sqText!=='');

  if(sellComplete&&(Number.isNaN(sp)||Number.isNaN(sq)||sp<0||sq<=0)){alert('Selling price must be 0 or more, and selling quantity must be greater than 0.');return}
  if(sellBlank&&sd){alert('Selling Date is only needed when you enter Selling Price and Sell Qty.');return}

  if(Number.isNaN(c)||c<0)c=0;
  const old=editingIndex===null?null:trades[editingIndex];
  const buyDate=(old&&(old.buyDate||old.date))||selected;
  if(sd && sd<buyDate){alert('Selling Date cannot be before the Buy Date.');return}

        const tag=(el.tagName||'').toLowerCase();
        const attrs=((el.id||'')+' '+(el.className||'')+' '+(el.getAttribute?.('title')||'')+' '+(el.getAttribute?.('src')||'')+' '+(el.getAttribute?.('data-testid')||'')).toString();
        if(/netlify/i.test(attrs) || /netlify-(drawer|toolbar)/i.test(tag)) hideNode(el);
        if(el.shadowRoot){
          const txt=(el.shadowRoot.textContent||'');
          if(needle.test(txt)) hideNode(el);
          scan(el.shadowRoot);
        }
        const txt=(el.textContent||'').trim();
        if(needle.test(txt)){
          const cs=getComputedStyle(el);
          if(cs.position==='fixed'||cs.position==='absolute'||tag==='iframe') hideNode(el);
        }
        /* Fallback: injected bottom-right fixed helper chip, never touch our app/modal */
        if(app && !app.contains(el)){
          const cs=getComputedStyle(el);
          if(cs.position==='fixed'){
            const r=el.getBoundingClientRect();
            const z=parseInt(cs.zIndex)||0;
            if(r.width>80 && r.width<380 && r.height>24 && r.height<130 && r.right>innerWidth-40 && r.bottom>innerHeight-40 && z>=1000) hideNode(el);
          }
        }
      }catch(e){}
    }
  }
  const run=()=>scan(document);
  new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true,attributes:true});
  run(); setInterval(run,250);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./service-worker.js?v=27', {updateViaCache:'none'});
      await reg.update();
    } catch(e) {}
  });
}
</script>
